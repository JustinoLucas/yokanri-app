<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!--
      CRITICAL STYLES — inline para carregar ANTES de qualquer arquivo externo.
      Elimina o flash branco que ocorre antes do CSS ser processado.
    -->
    <style>
      /* Fundo escuro imediato — a cor deve coincidir com --bg-primary */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0a0a0a;
      }

      /* ── Splash screen ─────────────────────────────────── */
      /* Aparece imediatamente, antes do React montar.        */
      /* Ocupa toda a tela sobre o #root (que ainda é vazio). */

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(135deg, #0a0a0a 0%, #0d1525 50%, #0a0a0a 100%);
        /* Transição de saída — deve coincidir com SPLASH_HIDE_DURATION em splashUtils.js */
        transition: opacity 0.35s ease;
      }

      /* Classe adicionada por splashUtils.hideSplash() */
      #app-splash.hiding {
        opacity: 0;
        pointer-events: none;
      }

      /* Wordmark "Yokanri" */
      .splash-wordmark {
        font-size: 26px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.4px;
        /* System font — Poppins pode não estar carregada ainda */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Spinner minimalista */
      .splash-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: splash-spin 0.75s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Texto de status — atualizado via splashUtils.setSplashStatus() */
      #splash-status {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.3px;
        min-height: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* Transição suave entre fases */
        transition: opacity 0.15s ease;
      }
    </style>

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="tauri-app" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Google Fonts — carregado de forma NÃO bloqueante.
      O truque "media=print → onload → media=all" evita que o navegador
      bloqueie o primeiro paint esperando a fonte externa.
      O noscript é o fallback para ambientes sem JS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <title>Yokanri</title>
  </head>
  <body>
    <!--
      HTML Splash Screen
      Visível IMEDIATAMENTE ao abrir o app, antes do React montar.
      O React renderiza em #root (abaixo do splash) durante o init.
      Quando pronto, splashUtils.hideSplash() faz o fade-out e remove o elemento.
    -->
    <div id="app-splash">
      <div class="splash-wordmark">Yokanri</div>
      <div class="splash-spinner"></div>
      <div id="splash-status">Iniciando...</div>
    </div>

    <!-- React monta aqui — abaixo do splash durante o init -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
