<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!--
      CRITICAL STYLES — inline para carregar ANTES de qualquer arquivo externo.
      Elimina o flash branco que ocorre antes do CSS ser processado.
    -->
    <style>
      /* Fundo escuro imediato — a cor deve coincidir com --bg-app (V3F dark) */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0a0a0c;
      }

      /* Light theme: trocar fundo imediatamente via data-theme */
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f3ef;
      }

      /* ── Splash screen ─────────────────────────────────── */
      /* Aparece imediatamente, antes do React montar.        */
      /* Ocupa toda a tela sobre o #root (que ainda é vazio). */

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0c;
        /* Transicao de saida — deve coincidir com SPLASH_HIDE_DURATION em splashUtils.js */
        transition: opacity 0.35s ease;
      }

      html[data-theme="light"] #app-splash {
        background: #f4f3ef;
      }

      /* Classe adicionada por splashUtils.hideSplash() */
      #app-splash.hiding {
        opacity: 0;
        pointer-events: none;
      }

      /* ── Ícone da splash ────────────────────────────── */
      .splash-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(145deg, #2DD4BF, #7C5CFF);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-icon-yo {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1;
      }

      /* Wordmark "Yokanri" */
      .splash-wordmark {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1;
      }

      .splash-wordmark-yo {
        background: linear-gradient(120deg, #4BE3D0, #8B6DFF);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .splash-wordmark-rest {
        color: #f5f5f7;
      }

      html[data-theme="light"] .splash-wordmark-rest {
        color: #1c1b18;
      }

      /* Spinner minimalista — cores da marca */
      .splash-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(45, 212, 191, 0.2);
        border-top-color: #2dd4bf;
        border-radius: 50%;
        animation: splash-spin 0.75s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Texto de status — atualizado via splashUtils.setSplashStatus() */
      #splash-status {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.25);
        letter-spacing: 0.3px;
        min-height: 16px;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        /* Transicao suave entre fases */
        transition: opacity 0.15s ease;
      }

      html[data-theme="light"] #splash-status {
        color: rgba(28, 27, 24, 0.35);
      }
    </style>

    <link rel="icon" type="image/svg+xml" href="/yokanri-favicon.svg" />
    <meta name="tauri-app" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fontes V3F: Geist + Geist Mono — bundled via @fontsource-variable -->

    <title>Yokanri</title>

    <!-- Aplica tema ANTES do primeiro paint para evitar flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yokanri-theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      HTML Splash Screen
      Visível IMEDIATAMENTE ao abrir o app, antes do React montar.
      O React renderiza em #root (abaixo do splash) durante o init.
      Quando pronto, splashUtils.hideSplash() faz o fade-out e remove o elemento.
    -->
    <div id="app-splash">
      <div class="splash-icon">
        <span class="splash-icon-yo">Yo</span>
      </div>
      <div class="splash-wordmark">
        <span class="splash-wordmark-yo">Yo</span><span class="splash-wordmark-rest">kanri</span>
      </div>
      <div class="splash-spinner"></div>
      <div id="splash-status">Iniciando...</div>
    </div>
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('yokanri-language') || 'pt-BR';
          var init = {
            'pt-BR': 'Iniciando...',
            'en':    'Starting...',
            'es':    'Iniciando...',
            'ja':    '起動中...',
            'kr':    '시작 중...',
            'ch':    '启动中...'
          };
          var el = document.getElementById('splash-status');
          if (el && init[lang]) el.textContent = init[lang];
        } catch(e) {}
      })();
    </script>

    <!-- React monta aqui — abaixo do splash durante o init -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
