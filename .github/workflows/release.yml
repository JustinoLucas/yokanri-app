name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_MANGADEX_CLIENT_ID: ${{ secrets.VITE_MANGADEX_CLIENT_ID }}
          VITE_MANGADEX_CLIENT_SECRET: ${{ secrets.VITE_MANGADEX_CLIENT_SECRET }}
          VITE_MANGADEX_USERNAME: ${{ secrets.VITE_MANGADEX_USERNAME }}
          VITE_MANGADEX_PASSWORD: ${{ secrets.VITE_MANGADEX_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Yokanri ${{ github.ref_name }}'
          releaseBody: |
            ## What's New in v0.7.0

            ### Internationalization (i18n) — 6 Languages
            Full multi-language support across the entire app: **Portuguese (pt-BR)**, **English**, **Spanish**, **Japanese**, **Korean**, and **Chinese**.

            - Unified i18n system: `strings.json` is now the single source of truth for all UI strings, including the onboarding flow
            - All components fully translated: ObraCard, ObraForm, ObraDetail, ObraList, ColecaoView, WorkspaceMenu, WorkspaceProfile, Statistics, and more
            - Library filter panel fully translated; Themes section removed
            - Export / Import / Move workspace modal fully translated
            - Visual Translation Editor (dev-only) now covers all sections: filters, modals, workspace menu, onboarding steps, and the Supporter page

            ### Onboarding Redesign
            - **StepSupporter** rewritten with two internal stages: platform selection (Patreon / Ko-fi cards with external links) → key input form; back button returns to platform selection instead of leaving the step
            - **StepEdition** layout improved: wider spacing, larger fonts, supporter badge repositioned inline

            ### Supporter Page (Settings)
            - New **"♥ Support"** tab in Settings navigation
            - Purple banner in the General tab links directly to the Supporter page
            - Supporter page includes: hero section, benefits list, Patreon and Ko-fi platform cards, and a key activation section (coming soon)

            ### Settings — Genres
            - **Adulto** genre is now marked as **+18 (NSFW) by default** on fresh installs
            - **Restore Defaults** now also reinstates genres that were deleted by the user

            ---
            **Full changelog:** https://github.com/JustinoLucas/yokanri-app/commits/main
          releaseDraft: true
          prerelease: false
